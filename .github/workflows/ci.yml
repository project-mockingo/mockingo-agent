name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine3.23
        env:
          POSTGRES_DB: mockingo_test
          POSTGRES_USER: mockingo
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mockingo -d mockingo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mockingo:test-password@localhost:5432/mockingo_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal pkg)"
      - run: go test ./...
      - run: go test -tags=integration ./internal/integration/...
      - run: go vet ./...
      - run: make cross-build
      - run: docker build -f deploy/Dockerfile.gateway -t mockingo-gateway:ci .
      - run: cp deploy/env.example deploy/.env
      - run: docker compose --env-file deploy/.env -f deploy/docker-compose.production.yml config --quiet

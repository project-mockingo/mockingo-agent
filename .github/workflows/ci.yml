name: CLI CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal *.go)"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: make cross-build

  windows-auth:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go test ./internal/cli ./internal/oauth ./internal/apiclient
      - run: go vet ./internal/cli

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal pkg)"
      - run: go test ./...
      - run: go vet ./...
      - run: make cross-build
      - run: docker build -f deploy/Dockerfile.gateway -t mockingo-gateway:ci .
      - run: cp deploy/env.example deploy/.env
      - run: docker compose --env-file deploy/.env -f deploy/docker-compose.production.yml config --quiet
